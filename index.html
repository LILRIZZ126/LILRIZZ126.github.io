<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Mie Goreng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="noodle-container">
        <!-- Uap Panas Bergerak -->
        <div class="steam-container">
            <div class="steam steam1"></div>
            <div class="steam steam2"></div>
            <div class="steam steam3"></div>
        </div>

        <!-- Sumpit -->
        <div class="chopsticks"></div>

        <!-- Mangkuk Mie -->
        <div class="bowl">
            <!-- Mie Goreng di Dalam Mangkuk -->
            <div class="fried-noodle">
                <div class="noodle-strand strand1"></div>
                <div class="noodle-strand strand2"></div>
                <div class="noodle-strand strand3"></div>
                <!-- Telur Mata Sapi di Atas Mie -->
                <div class="egg">
                    <div class="yolk"></div>
                </div>
            </div>
        </div>
        <!-- Bayangan Mangkuk -->
        <div class="shadow"></div>
    </div>

</body>
</html>
